{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangLearn - Daftar</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="auth-card">
        <h2>Daftar Baru</h2>
        <p>Mulai perjalanan belajar bahasa Inggris Anda.</p>
        
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="fullname">Nama Lengkap</label>
                <input type="text" id="fullname" name="fullname" placeholder="Nama lengkap Anda" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="contoh@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Buat password" required>
            </div>

            <div class="form-group">
                <label for="confirm">Konfirmasi Password</label>
                <input type="password" id="confirm" name="confirm_password" placeholder="Ulangi password" required>
            </div>
            
            <button type="submit" class="btn-primary">Buat Akun</button>
        </form>
        
        <div class="auth-footer">
            Sudah memiliki akun? <a href="{% url 'login' %}">Masuk di sini</a>
        </div>
    </div>
</body>
</html>
