{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangLearn - Login</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2 style="font-size: 2rem; color: var(--primary-blue); margin-bottom: 0.5rem;">LangLearn</h2>
            <p style="color: var(--text-muted); margin-bottom: 2.5rem;">Selamat datang kembali!</p>
            
            <form method="POST" action="{% url 'grammar' %}">
                {% csrf_token %}
                <div class="form-group" style="text-align: left; margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Username</label>
                    <input type="text" name="username" placeholder="Masukkan username" required>
                </div>
                <div class="form-group" style="text-align: left; margin-bottom: 2rem;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Password</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Masuk</button>
            </form>
            
            <div class="auth-footer" style="margin-top: 2rem; font-size: 0.9rem;">
                Belum punya akun? <a href="{% url 'register' %}" style="color: var(--primary-blue); text-decoration: none; font-weight: 600;">Daftar Akun</a>
            </div>
        </div>
    </div>
</body>
</html>
